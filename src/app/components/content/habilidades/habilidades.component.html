<div class="skill-grid">
  @for (group of groups; track group.title) {
    <article class="skill-card">
      <h3>{{ group.title }}</h3>
      <p>{{ group.description }}</p>
      <ul class="skill-tags" [attr.aria-label]="'Tecnologías de ' + group.title">
        @for (tool of group.tools; track tool) {
          <li>{{ tool }}</li>
        }
      </ul>
    </article>
  }
</div>
